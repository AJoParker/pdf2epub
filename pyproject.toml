[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf2epub"
version = "0.1.0"
description = "Convert PDF files to reflowable EPUB from the command line"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "pdf2epub contributors" }]
dependencies = [
  "pymupdf>=1.24.0",
  "ebooklib>=0.18",
  "typer>=0.12.0",
  "pillow>=10.0.0",
]

[project.optional-dependencies]
ocr = [
  "pytesseract>=0.3.10",
]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
pdf2epub = "pdf2epub.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
